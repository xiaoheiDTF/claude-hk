# Issue 标签定义文件
# 003-1-issue-init 读取此文件创建 GitHub 标签
# 格式: 标签名|颜色|描述
# 颜色为 6 位 hex（不含 #）
# init 后只允许使用此文件中定义的标签

# 类型标签
bug|d73a4a|Something isn't working
enhancement|a2eeef|New feature or request
documentation|0075ca|Improvements or additions to documentation
performance|fbca04|Performance related
chore|fef2c0|Maintenance or housekeeping

# 流程标签
in-progress|fbca04|Currently being worked on
rejected|e11d48|PR was rejected, needs rework

# 优先级
P0|b60205|Critical - must fix immediately
P1|d93f0b|High - fix as soon as possible
P2|fbca04|Medium - normal priority
P3|0e8a16|Low - nice to have
